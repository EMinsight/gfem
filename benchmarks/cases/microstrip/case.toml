format = 1
name = "microstrip"
size = "small"
family = "microstrip"
order = 2

[mesh]
sha256 = "52caa88ac88570ddd58d1128063b60f7d925f802d3ce66c58cf562c9689e1b89"
bytes = 2521418
length_unit = "um"
file = "mesh.msh.xz"

[mesh.source]
recipe = "gsim 0b3a3a1 build_microstrip.py (default preset), then voided by make_void.py (sio2 metal volumes 5 and 7 removed)"
commit = "858bc66"
note = "gsim at 0b3a3a1 has no lock file; built 2026-11-17 with fresh PDK packages, so conductivities are 21.64e6 and 30.3e6 S/m (earlier gsim-compare builds had 37.7e6). Imported from source/config.json with ABC order 2 changed to 1 and five frequencies, both ports excited. 315 870 DOF at order 2."

[regions]
sio2 = [3, 1]
sin = [3, 2]
air = [3, 3]
metal1_xy = [2, 4]
metal1_z = [2, 5]
topmetal2_xy = [2, 6]
topmetal2_z = [2, 7]
P1 = [2, 8]
P2 = [2, 9]
air__sio2 = [2, 10]
sin__sio2 = [2, 11]
air__sin = [2, 12]
air__None = [2, 13]

[problem]
kind = "driven"
frequencies_hz = [1000000000.0, 25000000000.0, 50000000000.0, 75000000000.0, 100000000000.0]
sweep = "uniform"
excite = ["p1", "p2"]

[quantities]
s = [["p1", "p1"], ["p2", "p1"], ["p1", "p2"], ["p2", "p2"]]

# Plan estimate hints, seconds per run at budget 16 (probes/12/plan.py); 600 = wall cap (Palace MUMPS 1x16 times out).
[est_s]
"gfem:direct" = 40
"gfem:petsc-mumps" = 45
"gfem:petsc-mumps@1x16" = 60
"gfem:bddc" = 50
"palace:mumps@16x1" = 150
"palace:mumps@8x2" = 170
"palace:mumps@4x4" = 220
"palace:mumps@2x8" = 350
"palace:mumps@1x16" = 600
"palace:pmg@16x1" = 80
"palace:pmg@8x2" = 90
"palace:pmg@4x4" = 110
"palace:pmg@2x8" = 150
"palace:pmg@1x16" = 250

