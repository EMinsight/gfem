format = 1
name = "microstrip"
size = "small"
family = "microstrip"
order = 2

[mesh]
sha256 = "52caa88ac88570ddd58d1128063b60f7d925f802d3ce66c58cf562c9689e1b89"
bytes = 2521418
length_unit = "um"
file = "mesh.msh.xz"

[mesh.source]
recipe = "gsim 0b3a3a1 build_microstrip.py (default preset), then voided by make_void.py (sio2 metal volumes 5 and 7 removed)"
commit = "858bc66"
note = "gsim at 0b3a3a1 has no lock file; built 2026-11-17 with fresh PDK packages, so conductivities are 21.64e6 and 30.3e6 S/m (earlier gsim-compare builds had 37.7e6). Imported from source/config.json with ABC order 2 changed to 1 and five frequencies, both ports excited. 315 870 DOF at order 2."

[regions]
