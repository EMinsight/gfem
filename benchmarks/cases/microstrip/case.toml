sin = [3, 2]
air = [3, 3]
metal1_xy = [2, 4]
metal1_z = [2, 5]
topmetal2_xy = [2, 6]
topmetal2_z = [2, 7]
P1 = [2, 8]
P2 = [2, 9]
air__sio2 = [2, 10]
sin__sio2 = [2, 11]
air__sin = [2, 12]
air__None = [2, 13]

[problem]
kind = "driven"
frequencies_hz = [1000000000.0, 25000000000.0, 50000000000.0, 75000000000.0, 100000000000.0]
