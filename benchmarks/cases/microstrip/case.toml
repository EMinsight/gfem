note = "gsim at 0b3a3a1 has no lock file; built 2026-11-17 with fresh PDK packages, so conductivities are 21.64e6 and 30.3e6 S/m (earlier gsim-compare builds had 37.7e6). Imported from source/config.json with ABC order 2 changed to 1 and five frequencies, both ports excited. 315 870 DOF at order 2."

