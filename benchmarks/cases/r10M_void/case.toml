[mesh.source]
recipe = "gsim r10M build (refinement bisected to 10 M DOF), then voided by reference/scripts/make_voided.py (sio2 volumes 5, 6, 7 removed); see source/build.json"
commit = "033594d"
note = "External mesh, never rebuilt. source/build.json's palace_msh_md5 ff40f9ed... is the cracked source mesh, not this voided file: the pin is the sha256 of the voided file as read. Imported from source/config.json with ABC order 2 changed to 1, 50 GHz only and port p1 excited only, as the earlier scaling comparison. 10 248 856 DOF at order 2."

