# Microstrip ladder rung L2 p2 (ticket 08, spec G2): reference campaigns only, never a suite case.
format = 1
name = "microstrip_L2_p2"
size = "large"
family = "microstrip"
order = 2

[mesh]
sha256 = "9e66ce0d0fe02e18d0c5935ea8e312757d51e0bede7603838602032c28664fe5"
bytes = 105775401
length_unit = "um"

[mesh.source]
recipe = "python tools/split_mesh.py on L1 (f79ff04d...)"
commit = "058b2f5"
note = "Uniform split level 2 of the microstrip mesh, external in the mesh stores; split_mesh.py rewrites it byte-identically. 19 342 400 DOF at order 2."

[regions]
sio2 = [3, 1]
sin = [3, 2]
air = [3, 3]
metal1_xy = [2, 4]
metal1_z = [2, 5]
topmetal2_xy = [2, 6]
topmetal2_z = [2, 7]
P1 = [2, 8]
P2 = [2, 9]
air__sio2 = [2, 10]
sin__sio2 = [2, 11]
air__sin = [2, 12]
air__None = [2, 13]

[problem]
kind = "driven"
frequencies_hz = [1000000000.0, 25000000000.0, 50000000000.0, 75000000000.0, 100000000000.0]
sweep = "uniform"
excite = ["p1", "p2"]

[quantities]
s = [["p1", "p1"], ["p2", "p1"], ["p1", "p2"], ["p2", "p2"]]

[est_s]
"gfem:bddc" = 8000  # MN5 highmem 1x112: 6905 s with two preconditioner reuses (job 49176384); ~1500 s per frequency without (BDDC setup ~960 s, solve ~530 s)

[[materials]]
region = "sio2"
eps_r = 4.1
tan_delta = 0.0

[[materials]]
region = "sin"
eps_r = 7.5
tan_delta = 0.001

[[materials]]
region = "air"
eps_r = 1.0
tan_delta = 0.0

[[boundaries]]
kind = "conductor"
region = "metal1_xy"
conductivity = 21640000.0
thickness = 0.41999999999999993

[[boundaries]]
kind = "conductor"
region = "metal1_z"
conductivity = 21640000.0
thickness = 0.41999999999999993

[[boundaries]]
kind = "conductor"
region = "topmetal2_xy"
conductivity = 30300000.0
thickness = 3.0

[[boundaries]]
kind = "conductor"
region = "topmetal2_z"
conductivity = 30300000.0
thickness = 3.0

[[boundaries]]
kind = "absorbing"
region = "air__None"
order = 1

[[ports]]
kind = "lumped"
name = "p1"
impedance_ohm = 50.0
elements = [{region = "P1", direction = "+z"}]

[[ports]]
kind = "lumped"
name = "p2"
impedance_ohm = 50.0
elements = [{region = "P2", direction = "+z"}]
