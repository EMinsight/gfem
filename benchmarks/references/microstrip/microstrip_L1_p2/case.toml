# Microstrip ladder rung L1 p2 (ticket 08, spec G2): reference campaigns only, never a suite case.
format = 1
name = "microstrip_L1_p2"
size = "small"
family = "microstrip"
order = 2

[mesh]
sha256 = "f79ff04df7165c5b186a0d73c8844cd52944ae00ee70daa52c31289df40722b3"
bytes = 14160567
length_unit = "um"

[mesh.source]
recipe = "python tools/split_mesh.py on the microstrip pinned mesh 52caa88a..."
commit = "058b2f5"
note = "Uniform split level 1 of the microstrip mesh, external in the mesh stores; split_mesh.py rewrites it byte-identically. 2 454 328 DOF at order 2."

[regions]
sio2 = [3, 1]
sin = [3, 2]
air = [3, 3]
metal1_xy = [2, 4]
metal1_z = [2, 5]
