topmetal2_z = [2, 7]
P1 = [2, 8]
P2 = [2, 9]
air__sio2 = [2, 10]
sin__sio2 = [2, 11]
air__sin = [2, 12]
air__None = [2, 13]

[problem]
kind = "driven"
frequencies_hz = [1000000000.0, 25000000000.0, 50000000000.0, 75000000000.0, 100000000000.0]
sweep = "uniform"
excite = ["p1", "p2"]

[quantities]
s = [["p1", "p1"], ["p2", "p1"], ["p1", "p2"], ["p2", "p2"]]

[est_s]
"gfem:direct" = 300
"gfem:bddc" = 300
"palace:mumps" = 600

[[materials]]
