# Campaign series (ADRs 0450, 0456, 0458; ticket 08): lcavity and microstrip at core
# budget 56 on a standard node, the whole layout grid, 3 repeats, the tolerance ladder
# on microstrip's iterative kinds at the default layout.
schema = 1
cases = ["lcavity", "microstrip"]
solvers = ["gfem:direct", "gfem:petsc-mumps", "gfem:bddc", "palace:mumps", "palace:pmg"]
layouts = ["best"]
core_budget = 56
repeats = 3
node_class = "standard"
anchor_tolerance = 1e-8

[jobs]
group = "case"

[wall_cap_s]
lcavity = 600
microstrip = 600

[[ladder]]
cases = ["microstrip"]
solvers = ["gfem:bddc", "palace:pmg"]
tolerances = [1e-6, 1e-8, 1e-10]
layout = "default"

[stacks.wheels.versions]
palace = "0.19.0"
