# Campaign series: the bragg palace:pmg observation cell, core
# budget 16, default layout 16x1, 3 repeats, cap 900 s. plan adds the same-code
# palace:mumps run.
# On this Bloch-periodic case pmg takes about 1 000 GMRES iterations per inner solve
# (about 6 min a run against about 1 s for mumps), so it runs once, not over the grid.
schema = 1
cases = ["bragg"]
solvers = ["palace:pmg"]
layouts = ["default"]
core_budget = 16
repeats = 3
node_class = "standard"
anchor_tolerance = 1e-8

[jobs]
group = "case"

[wall_cap_s]
bragg = 900

[stacks.wheels.versions]
palace = "0.19.0"
